name: CI-CD Backend Heladeria

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-heladeria-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Publicar imagen en Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen del Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/heladeria-backend:latest

  test-ssh:
    name: Probar conexión con EC2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-push

    steps:
      - name: Preparar acceso SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions_backend
          chmod 600 ~/.ssh/github_actions_backend

          ssh-keyscan \
            -T 10 \
            -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Comprobar servidor EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/github_actions_backend \
            "ubuntu@$EC2_HOST" 'bash -se' <<'EOF'
          set -e

          echo "Conexión SSH correcta."
          echo "Usuario remoto: $(whoami)"
          echo "Servidor remoto: $(hostname)"

          docker --version
          docker compose version

          test -d /home/ubuntu/Docker-Heladeria

          echo "Directorio Docker-Heladeria encontrado."
          EOF

  deploy-backend:
    name: Desplegar Backend en EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-ssh

    steps:
      - name: Preparar acceso SSH para despliegue
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions_backend
          chmod 600 ~/.ssh/github_actions_backend

          ssh-keyscan \
            -T 10 \
            -H "$EC2_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Actualizar Backend en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -T \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/github_actions_backend \
            "ubuntu@$EC2_HOST" 'bash -se' <<'EOF'
          set -Eeuo pipefail

          cd /home/ubuntu/Docker-Heladeria

          compose() {
            docker compose \
              --env-file .env.aws \
              -f docker-compose.aws.yml \
              "$@"
          }

          echo "Descargando la imagen más reciente del Backend..."
          compose pull backend

          echo "Recreando únicamente el contenedor Backend..."
          compose up \
            -d \
            --no-deps \
            --force-recreate \
            backend

          echo "Esperando que la API esté disponible..."

          for intento in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 3 \
              --max-time 5 \
              http://localhost:5000/api/sabores \
              > /dev/null 2>&1
            then
              echo "Backend funcionando correctamente."
              compose ps backend

              echo "Eliminando imágenes antiguas sin etiqueta..."
              docker image prune -f

              exit 0
            fi

            echo "Intento $intento de 30: Backend todavía iniciando..."
            sleep 3
          done

          echo "ERROR: El Backend no respondió después de 90 segundos."

          compose ps backend || true
          compose logs --tail=150 backend || true

          exit 1
          EOF